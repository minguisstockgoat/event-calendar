<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자본조달 이벤트 캘린더</title>
<style>
/* Theme: Ocean Depths - Deep Navy #1a2332 · Teal #2d8b8b · Seafoam #a8dadc · Cream #f1faee */
:root{
  --bg:#141c29; --panel:#1a2332; --panel2:#212d40; --line:rgba(168,218,220,.16);
  --line2:rgba(168,218,220,.09);
  --tx:#f1faee; --tx2:#a8dadc; --tx3:#6f8f9c;
  --teal:#2d8b8b; --teal-hi:#3aa9a9; --teal-bg:rgba(45,139,139,.18);
  --foam:#a8dadc; --foam-bg:rgba(168,218,220,.12);
  --cream:#f1faee;
  --shadow:0 2px 6px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.30);
}
:root[data-theme=light]{
  --bg:#eef6f1; --panel:#ffffff; --panel2:#f4faf7; --line:#cfe4e2; --line2:#e2efed;
  --tx:#1a2332; --tx2:#3f5a66; --tx3:#7d97a1;
  --teal:#237a7a; --teal-hi:#2d8b8b; --teal-bg:rgba(45,139,139,.12);
  --foam:#4d8f96; --foam-bg:rgba(45,139,139,.08);
  --cream:#f1faee;
  --shadow:0 1px 3px rgba(26,35,50,.08),0 8px 26px rgba(26,35,50,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55;
  font-family:"DejaVu Sans","Segoe UI","Malgun Gothic","맑은 고딕",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--teal-hi);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px}

/* 제목 + 검색바 전체 고정 영역 */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);
  padding-top:18px;border-bottom:1px solid var(--line2)}

header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--teal-hi);text-transform:uppercase}
h1{font-size:22px;margin:4px 0 2px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--tx2);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:11.5px;color:var(--tx2);white-space:nowrap}
.chip b{color:var(--tx);font-weight:700}
.tgl{background:var(--panel);border:1px solid var(--line);color:var(--tx2);border-radius:9px;
  padding:6px 11px;cursor:pointer;font-size:13px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 12px}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit}
.toolbar input[type=search]{min-width:190px}
.count{color:var(--tx2);font-size:12.5px;margin-left:auto}

.layout{display:grid;grid-template-columns:5fr 7fr;gap:14px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* company list */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;
  cursor:pointer;box-shadow:var(--shadow);transition:.12s;display:flex;gap:11px;align-items:center}
.row:hover{border-color:var(--teal-hi)}
.row.active{border-color:var(--teal-hi);box-shadow:0 0 0 2px var(--teal-hi) inset,var(--shadow)}
.dday{flex:none;min-width:52px;text-align:center;border-radius:9px;padding:6px 4px;
  font-weight:800;font-size:13px;background:var(--foam-bg);color:var(--foam)}
.dday.hot{background:var(--teal);color:var(--cream)}
.dday .dl{display:block;font-size:9.5px;font-weight:600;opacity:.85;margin-top:1px}
.rmain{min-width:0;flex:1}
.rname{font-weight:700;font-size:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.code{color:var(--tx3);font-size:11px;font-weight:400}
.rnext{color:var(--tx2);font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:1px 7px;
  font-size:10.5px;font-weight:700;white-space:nowrap;background:var(--teal-bg);color:var(--teal-hi);
  border:1px solid transparent}
.badge.o{background:transparent;border-color:var(--line);color:var(--tx2)}

/* 이벤트 유형별 색 (배지 텍스트 라벨 항상 동반 - 색만으로 구분하지 않음) */
.t-paid{--tc:#2d8b8b}   /* 유상   teal   */
.t-mixed{--tc:#3f9d77}  /* 유무상 청록   */
.t-free{--tc:#7fb069}   /* 무상   green  */
.t-cb{--tc:#e0a458}     /* CB     amber  */
.t-bw{--tc:#a684ee}     /* BW     violet */
.t-eb{--tc:#6aa3e0}     /* EB     blue   */
:root[data-theme=light] .t-paid{--tc:#1f6f6f}
:root[data-theme=light] .t-mixed{--tc:#2e7d5b}
:root[data-theme=light] .t-free{--tc:#567f3e}
:root[data-theme=light] .t-cb{--tc:#a9762a}
:root[data-theme=light] .t-bw{--tc:#7e5fd0}
:root[data-theme=light] .t-eb{--tc:#3f7fc0}
.badge.ty{background:color-mix(in srgb, var(--tc) 17%, transparent);color:var(--tc)}
/* 행 박스 둘레 전체 + D-day 박스를 유형 색으로 - 한눈에 유형 구분 */
:root{--pilltx:#0f1622}
:root[data-theme=light]{--pilltx:#ffffff}
.row[class*="t-"]{border-color:color-mix(in srgb, var(--tc) 62%, var(--panel))}
.row[class*="t-"]:hover{border-color:var(--tc)}
.row[class*="t-"].active{border-color:var(--tc);
  box-shadow:0 0 0 2px var(--tc) inset,var(--shadow)}
.row[class*="t-"] .dday{background:color-mix(in srgb, var(--tc) 22%, transparent);color:var(--tc)}
.row[class*="t-"] .dday.hot{background:var(--tc);color:var(--pilltx)}

/* detail panel */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);padding:18px 20px;position:sticky;
  top:calc(var(--tbh, 150px) + 12px);
  max-height:calc(100vh - var(--tbh, 150px) - 26px);overflow-y:auto}
@media(max-width:860px){.detail{position:static;max-height:none}}
.detail .dt-head{border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:14px}
.dt-name{font-size:19px;font-weight:800;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.dt-meta{color:var(--tx2);font-size:12.5px;margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px;margin:0 0 16px}
.kv .k{color:var(--tx2)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
/* 공시시점 -> 현재 병기 */
.was{color:var(--tx3)}
.arr{color:var(--tx3);margin:0 5px}
.good{color:#4fc98a;font-weight:700}
.bad{color:#e0736f;font-weight:700}
:root[data-theme=light] .good{color:#1e8f5e}
:root[data-theme=light] .bad{color:#c94f4f}
.mini{display:inline-block;font-size:9.5px;font-weight:800;border-radius:4px;padding:0 5px;
  margin-left:6px;vertical-align:1px;background:var(--teal-bg);color:var(--teal-hi)}
.mini.est{background:var(--foam-bg);color:var(--foam)}
/* 청약 판단 카드 */
.decide{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin:0 0 16px;display:flex;gap:18px;flex-wrap:wrap}
.decide div{display:flex;flex-direction:column;gap:2px}
.decide .k{color:var(--tx3);font-size:10.5px;white-space:nowrap}
.decide .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.decide .v.small{font-size:13px;padding-top:3px}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-hi);
  font-weight:800;margin:0 0 10px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:86px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:flex;gap:0;align-items:flex-start;padding:6px 0;position:relative}
.tl .d{width:74px;flex:none;text-align:right;color:var(--tx2);font-size:12px;padding-top:1px}
.tl .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--tx3);
  margin:5px 12px 0 8px;box-shadow:0 0 0 3px var(--panel);position:relative;z-index:1}
.tl .lb{flex:1;font-size:13.2px;min-width:0}
.tl .sub2{color:var(--tx3);font-size:11px}
.tl li.past .lb,.tl li.past .d{color:var(--tx3)}
.tl li.past .dot{background:var(--line)}
.tl li.next .dot{background:var(--teal-hi);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--teal-bg)}
.tl li.next .lb{font-weight:700}
.tl li.future .dot{background:var(--foam)}
.tl .conf{display:inline-block;margin-left:7px;font-size:10px;font-weight:800;
  background:var(--teal-bg);color:var(--teal-hi);border-radius:5px;padding:0 6px;vertical-align:1px}
.tl .dday2{color:var(--teal-hi);font-weight:700;font-size:11.5px;margin-left:7px}

.empty{padding:48px 20px;text-align:center;color:var(--tx2)}
.footer{color:var(--tx3);font-size:11.5px;margin-top:22px;line-height:1.7}
.loading{padding:60px;text-align:center;color:var(--tx2)}

/* 탭 (캘린더 / 오버행) */
.tabs{display:flex;gap:6px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--tx2);border-radius:9px;
  padding:6px 14px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.tab.on{background:var(--teal);border-color:var(--teal);color:var(--cream)}

/* CPS(전환우선주) 유형 색 */
.t-cps{--tc:#d98ca6}
:root[data-theme=light] .t-cps{--tc:#b25577}

/* 오버행 뷰 */
.ohlist{display:flex;flex-direction:column;gap:8px}
.ohcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.ohhead{display:grid;grid-template-columns:minmax(160px,1.35fr) 1.25fr 1.05fr .75fr;gap:10px;
  align-items:center;padding:10px 14px;cursor:pointer}
@media(max-width:760px){.ohhead{grid-template-columns:1fr 1fr}}
.ohcard:hover{border-color:var(--teal-hi)}
.ohk{color:var(--tx3);font-size:10px}
.ohv{font-weight:700;font-size:13.5px}
.ohbar{height:5px;border-radius:3px;background:var(--line2);margin-top:4px;overflow:hidden;max-width:190px}
.ohbar i{display:block;height:100%;background:var(--teal-hi)}
.ohbar i.hi{background:#e0736f}
.ohevents{border-top:1px solid var(--line2);padding:8px 14px;display:none}
.ohcard.open .ohevents{display:block}
.ohev{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:7px 0;
  border-bottom:1px dashed var(--line2);font-size:12.5px}
.ohev:last-child{border-bottom:none}
.st{font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px}
.st.on{background:rgba(224,115,111,.16);color:#e0736f}
:root[data-theme=light] .st.on{background:rgba(201,79,79,.12);color:#c94f4f}
.st.wait{background:var(--foam-bg);color:var(--foam)}

/* 자동 갱신 LIVE 칩 */
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4fc98a;
  margin-right:6px;animation:pu 2s infinite;vertical-align:1px}
@keyframes pu{50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
  <header>
    <div>
      <div class="eyebrow">Ocean Depths · Event Intel</div>
      <h1>자본조달 이벤트 캘린더</h1>
      <div class="sub">진행 중인 유·무상증자, CB·BW·EB·CPS의 남은 일정과 전환 오버행을 기업별로</div>
    </div>
    <div class="chips" id="meta"></div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab on" id="tabCal">📅 캘린더</button>
      <button class="tab" id="tabOh">⚖ 오버행</button>
    </div>
    <input type="search" id="q" placeholder="종목명·코드 검색">
    <select id="fType">
      <option value="">전체 유형</option>
      <option value="paid_capital_increase">유상증자</option>
      <option value="cps">CPS(전환우선주)</option>
      <option value="free_capital_increase">무상증자</option>
      <option value="mixed_capital_increase">유무상증자</option>
      <option value="convertible_bond">CB</option>
      <option value="bond_with_warrant">BW</option>
      <option value="exchangeable_bond">EB</option>
    </select>
    <select id="fSort">
      <option value="next">다음 일정 임박순</option>
      <option value="recent">최근 공시순</option>
    </select>
    <select id="ohSort" style="display:none">
      <option value="pct">유동주식수 대비 큰순</option>
      <option value="end">오버행 종료 임박순</option>
      <option value="value">금액 큰순</option>
    </select>
    <select id="ohMcap" style="display:none" title="시가총액 하한">
      <option value="">시총 전체</option>
      <option value="500">시총 500억↑</option>
      <option value="1000">시총 1,000억↑</option>
      <option value="3000">시총 3,000억↑</option>
      <option value="5000">시총 5,000억↑</option>
      <option value="10000">시총 1조↑</option>
      <option value="30000">시총 3조↑</option>
    </select>
    <select id="ohFcap" style="display:none" title="유동시총 하한">
      <option value="">유동시총 전체</option>
      <option value="300">유동시총 300억↑</option>
      <option value="500">유동시총 500억↑</option>
      <option value="1000">유동시총 1,000억↑</option>
      <option value="3000">유동시총 3,000억↑</option>
      <option value="5000">유동시총 5,000억↑</option>
      <option value="10000">유동시총 1조↑</option>
    </select>
    <button class="tgl" id="refreshBtn" title="시세·데이터 갱신">↻ 시세</button>
    <span class="chip" id="qstamp" style="display:none"></span>
    <button class="tgl" id="themeBtn" title="테마 전환">◐</button>
    <span class="count" id="count"></span>
  </div>
  </div><!-- /topbar -->

  <div class="layout" id="calWrap">
    <div class="list" id="list"></div>
    <aside class="detail" id="detail"><div class="empty">기업을 선택하세요</div></aside>
  </div>
  <div class="ohlist" id="ohlist" style="display:none"></div>

  <div id="boot" class="loading">데이터 불러오는 중…</div>
  <div class="footer" id="footer"></div>
</div>

<script>
// 실시간 시세 프록시 (Cloudflare Worker) URL. 비어 있으면 '↻ 시세' 버튼은
// 최신 정적 데이터 재로드로 동작한다. 배포법: worker/DEPLOY.md
const QUOTE_PROXY = 'https://krx-quote-proxy.eogks879.workers.dev';

const TYPE_SHORT = {paid_capital_increase:'유상', free_capital_increase:'무상',
  mixed_capital_increase:'유무상', convertible_bond:'CB',
  bond_with_warrant:'BW', exchangeable_bond:'EB'};
const TYPE_CLASS = {paid_capital_increase:'t-paid', free_capital_increase:'t-free',
  mixed_capital_increase:'t-mixed', convertible_bond:'t-cb',
  bond_with_warrant:'t-bw', exchangeable_bond:'t-eb'};
const state = {data:null, sel:null, quotes:{}, qstamp:'', tab:'cal', ohOpen:new Set()};
// CPS(전환우선주)는 event_type=유상증자 + subtype='cps'
const shortType = c => c.subtype==='cps' ? 'CPS' : (TYPE_SHORT[c.event_type]||'');
const classType = c => c.subtype==='cps' ? 't-cps' : (TYPE_CLASS[c.event_type]||'');
function typeMatch(ty, c){
  if(!ty) return true;
  if(ty==='cps') return c.subtype==='cps';
  if(ty==='paid_capital_increase')
    return c.event_type==='paid_capital_increase' || c.event_type==='mixed_capital_increase';
  return c.event_type===ty;
}
// 실시간 시세가 있으면 그걸, 없으면 export 시점 최신 종가를 쓴다
function liveClose(c){
  const q = state.quotes[c.stock_code];
  return q && q.price ? q.price : (c.now && c.now.close) || null;
}
function liveStamp(c){
  const q = state.quotes[c.stock_code];
  if(q && q.price) return `실시간 ${q.time||''}`.trim();
  return c.now && c.now.date ? `${c.now.date.slice(4,6)}.${c.now.date.slice(6)} 종가` : '';
}
const $ = s => document.querySelector(s);
const nf = (v,d=0)=> v==null?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d});
const pct = v => v==null?'—':(v>0?'+':'')+Number(v).toFixed(1)+'%';

function todayStr(){
  const t = new Date();
  return `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
}
function fmtD(d, base){
  if(!d || d.length!==8) return d||'';
  return d.slice(0,4)===base.slice(0,4) ? `${d.slice(4,6)}.${d.slice(6)}` :
    `${d.slice(0,2)==='20'?d.slice(2,4):d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}`;
}
function ddayOf(d){
  const t = todayStr();
  const ms = (new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6)))
           - (new Date(+t.slice(0,4), +t.slice(4,6)-1, +t.slice(6)));
  return Math.round(ms / 86400000);
}
// 실시간 D-day: 데이터 생성 이후 날짜가 지나도 다음 일정을 다시 고른다
function nextItem(c){
  const t = todayStr();
  const longTail = ['만기','청구 종료','행사기간 종료'];
  return c.items.find(it => it.date >= t && it.label !== '공시'
    && !longTail.some(k => it.label.includes(k))) || null;
}

function rows(){
  let r = state.data.companies.slice();
  const q = $('#q').value.trim().toLowerCase();
  if(q) r = r.filter(c => (c.corp_name||'').toLowerCase().includes(q) || (c.stock_code||'').includes(q));
  const ty = $('#fType').value;
  if(ty) r = r.filter(c => typeMatch(ty, c));
  if($('#fSort').value === 'recent') r.sort((a,b)=> b.event_date.localeCompare(a.event_date));
  else r.sort((a,b)=>{
    const x = nextItem(a), y = nextItem(b);
    return (x?x.date:'99999999').localeCompare(y?y.date:'99999999');
  });
  return r;
}

function renderList(){
  const data = rows(), box = $('#list');
  box.innerHTML = '';
  const t = todayStr();
  data.forEach(c=>{
    const nx = nextItem(c);
    const dd = nx ? ddayOf(nx.date) : null;
    const el = document.createElement('div');
    const tc = classType(c);
    el.className = 'row ' + tc + (state.sel === c ? ' active' : '');
    el.onclick = ()=>{ state.sel = c; renderList(); renderDetail();
      if(innerWidth <= 860) $('#detail').scrollIntoView({behavior:'smooth'}); };
    const oh = c.overhang;
    el.innerHTML = `
      <div class="dday ${dd!=null && dd<=7 ? 'hot':''}">${dd==null?'—':(dd===0?'D-Day':'D-'+dd)}
        <span class="dl">${nx?fmtD(nx.date,t):''}</span></div>
      <div class="rmain">
        <div class="rname">${c.corp_name} <span class="code num">${c.stock_code||''}</span>
          <span class="badge ty ${tc}">${shortType(c)}</span>
          ${c.market?`<span class="badge o">${c.market}</span>`:''}
          ${oh && oh.pct_float!=null?`<span class="badge o">오버행 유동 ${oh.pct_float.toFixed(1)}%</span>`:''}</div>
        <div class="rnext">${nx ? '다음 · ' + nx.label : '남은 일정 없음'}</div>
      </div>`;
    box.appendChild(el);
  });
  $('#count').textContent = `${data.length}개 기업 진행 중`;
  if(!state.sel && data.length){ state.sel = data[0]; renderDetail();
    document.querySelector('.row')?.classList.add('active'); }
}

// '공시시점 → 현재' 병기 셀
function pairCell(was, now, goodPositive){
  if(now==null || now==='') return was==null?'':String(was);
  const nowCls = goodPositive==null ? '' : (goodPositive ? 'good' : 'bad');
  if(was==null || was==='') return `<b class="${nowCls}">${now}</b>`;
  return `<span class="was">${was}</span><span class="arr">→</span><b class="${nowCls}">${now}</b>`;
}

function termsKv(c){
  const t = c.terms||{}, n = c.now||{};
  const kv=(k,v)=>v==null||v===''?'':`<div class="k">${k}</div><div class="v num">${v}</div>`;
  const live = liveClose(c);
  const liveCell = live ? `${nf(live)}원 <span class="was">(${liveStamp(c)})</span>` : '';

  if(['convertible_bond','bond_with_warrant','exchangeable_bond'].includes(c.event_type)){
    const nowMoney = (live && t.conv_price) ? (live/t.conv_price-1)*100 : null;
    return kv('발행 규모', t.raise_eok!=null?nf(t.raise_eok)+'억 원':'')
      + kv('전환/행사가', t.conv_price!=null?nf(t.conv_price)+'원':'')
      + kv('현재가', liveCell)
      + kv('주가/전환가', pairCell(
          t.moneyness_pct!=null?pct(t.moneyness_pct)+' 공시시점':null,
          nowMoney!=null?pct(nowMoney):null,
          nowMoney!=null?nowMoney>0:null))
      + kv('이론가/액면 (공시시점)', pct(t.theory_vs_par_pct))
      + kv('사모 여부', t.is_private==null?'—':(t.is_private?'사모':'공모'))
      + kv('리픽싱 하한', t.refix_floor_pct!=null?t.refix_floor_pct+'%':'')
      + kv('잠재 희석', t.dilution_pct!=null?t.dilution_pct+'%':'');
  }
  const issue = n.final_price || t.implied_issue_price;
  const nowDisc = (live && issue) ? (live-issue)/live*100 : null;
  const issueCell = n.final_price
    ? `${nf(n.final_price)}원<span class="mini ${n.final_confirmed?'':'est'}">${n.final_confirmed?'확정':'예상'}</span>`
    : (t.implied_issue_price!=null?nf(t.implied_issue_price)+'원 (추정)':'');
  return kv('방식', t.method||'')
    + kv('조달 규모', t.raise_eok!=null?nf(t.raise_eok)+'억 원':'')
    + kv('발행가', issueCell)
    + kv('현재가', liveCell)
    + kv('할인율', pairCell(
        t.discount_pct!=null?t.discount_pct+'% 공시시점':null,
        nowDisc!=null?nowDisc.toFixed(1)+'%':null,
        nowDisc!=null?nowDisc>0:null))
    + kv('무상 비율', t.bonus_ratio!=null?'1주당 '+t.bonus_ratio+'주':'')
    + kv('권리락 이론가 (공시시점)', t.theo_ex_rights_price!=null?nf(t.theo_ex_rights_price)+'원':'')
    + kv('희석', t.dilution_pct!=null?t.dilution_pct+'%':'');
}

// 주주배정 유증 청약 판단 카드 (예상/확정 발행가 vs 현재가)
function decideCard(c){
  const n = c.now||{};
  if(!n.final_price) return '';
  const live = liveClose(c);
  if(!live) return '';
  const margin = (live - n.final_price) / live * 100;
  const t = todayStr();
  const lst = (c.items||[]).find(it=>it.label==='신주 상장' && it.date>=t);
  const dd = lst ? ddayOf(lst.date) : null;
  return `<div class="sec">청약 판단${n.final_confirmed?'':' · 예상 발행가는 규정식 근사'}</div>
  <div class="decide">
    <div><span class="k">발행가</span><span class="v">${nf(n.final_price)}원<span class="mini ${n.final_confirmed?'':'est'}">${n.final_confirmed?'확정':'예상'}</span></span></div>
    <div><span class="k">현재가 대비 마진</span><span class="v ${margin>0?'good':'bad'}">${pct(margin)}</span></div>
    ${dd!=null?`<div><span class="k">신주 상장까지</span><span class="v small">${dd===0?'D-Day':'D-'+dd} (${fmtD(lst.date,t)})</span></div>`:''}
    <div><span class="k">현재가</span><span class="v small">${nf(live)}원 · ${liveStamp(c)}</span></div>
  </div>`;
}

// 상세 패널 오버행 카드 (해당 이벤트가 전환청구 창을 갖는 경우)
function overhangCard(c){
  const o = c.overhang;
  if(!o) return '';
  const t = todayStr();
  const live = liveClose(c);
  const open = o.start && o.start <= t;
  const dd = o.end >= t ? ddayOf(o.end) : null;
  return `<div class="sec">오버행 (잠재 물량)</div>
  <div class="decide">
    <div><span class="k">잠재물량</span><span class="v">${nf(o.shares)}주</span></div>
    ${o.pct_float!=null?`<div><span class="k">유동주식수 대비</span><span class="v ${o.pct_float>=20?'bad':''}">${o.pct_float.toFixed(1)}%</span></div>`:''}
    ${live?`<div><span class="k">금액 (현재가)</span><span class="v small">${nf(o.shares*live/1e8)}억 원</span></div>`:''}
    ${o.adv_days!=null?`<div><span class="k">ADV20 흡수</span><span class="v small">${nf(o.adv_days,1)}일치</span></div>`:''}
    <div><span class="k">청구 창</span><span class="v small">${o.start?fmtD(o.start,t):'?'} ~ ${fmtD(o.end,t)}
      <span class="st ${open?'on':'wait'}">${open?'청구가능':'대기'}</span>${dd!=null?` D-${dd}`:''}</span></div>
  </div>`;
}

function renderDetail(){
  const c = state.sel, box = $('#detail');
  if(!c){ box.innerHTML = '<div class="empty">기업을 선택하세요</div>'; return; }
  const t = todayStr();
  const nx = nextItem(c);
  const lis = c.items.map(it=>{
    const end = it.end ? ` ~ ${fmtD(it.end,t)}` : '';
    const isPast = (it.end || it.date) < t;
    const isNext = nx && it === nx;
    const cls = isPast ? 'past' : (isNext ? 'next' : 'future');
    const dd = !isPast && it.date >= t ? ddayOf(it.date) : null;
    return `<li class="${cls}">
      <span class="d num">${fmtD(it.date,t)}</span><span class="dot"></span>
      <span class="lb">${it.label}${end?`<span class="sub2">${end}</span>`:''}
        ${it.confirmed?`<a class="conf" href="${it.url}" target="_blank" rel="noopener">공시 ↗</a>`:''}
        ${dd!=null && dd<=30 ? `<span class="dday2 num">${dd===0?'D-Day':'D-'+dd}</span>`:''}
      </span></li>`;
  }).join('');
  const tc = classType(c);
  box.innerHTML = `
    <div class="dt-head">
      <div class="dt-name">${c.corp_name} <span class="code num">${c.stock_code||''} · ${c.market||''}</span>
        <span class="badge ty ${tc}">${shortType(c)}</span></div>
      <div class="dt-meta">${c.event_label}${c.subtype==='cps'?' (전환우선주)':''} · ${fmtD(c.event_date,t)} 공시 ·
        <a href="${c.dart_url}" target="_blank" rel="noopener">DART 원문 ↗</a></div>
    </div>
    ${decideCard(c)}
    ${overhangCard(c)}
    <div class="sec">발행 조건</div>
    <div class="kv">${termsKv(c)}</div>
    <div class="sec">일정 타임라인</div>
    <ul class="tl">${lis}</ul>`;
}

// ---------------------------------------------------------------- 오버행 탭
function ohLive(code, fallback){
  const q = state.quotes[code];
  return q && q.price ? q.price : fallback;
}
function ohRows(){
  const q = $('#q').value.trim().toLowerCase();
  const ty = $('#fType').value;
  let r = (state.data.overhang||[]).map(c=>{
    const evs = c.events.filter(e=>typeMatch(ty, e));
    if(!evs.length) return null;
    const shares = evs.reduce((s,e)=>s+e.shares,0);
    const close = ohLive(c.stock_code, c.close);
    return {...c, evs, shares, close,
      pctFloat: c.float_shares ? shares/c.float_shares*100 : null,
      valueEok: close ? shares*close/1e8 : null,
      floatEok: close && c.float_shares ? c.float_shares*close/1e8 : null,
      // 시총 = 유동주식수 / 유동비율 x 현재가 (역산)
      mcapEok: close && c.float_shares && c.float_ratio_pct
        ? c.float_shares/(c.float_ratio_pct/100)*close/1e8 : null,
      nearEnd: evs.reduce((m,e)=>e.end<m?e.end:m,'99999999')};
  }).filter(Boolean);
  if(q) r = r.filter(c=>(c.corp_name||'').toLowerCase().includes(q)||(c.stock_code||'').includes(q));
  // 규모 하한 필터 (억 원). 시총·유동시총 미산출 종목은 하한 설정 시 제외.
  const mMin = +$('#ohMcap').value || 0, fMin = +$('#ohFcap').value || 0;
  if(mMin) r = r.filter(c=>c.mcapEok!=null && c.mcapEok >= mMin);
  if(fMin) r = r.filter(c=>c.floatEok!=null && c.floatEok >= fMin);
  const s = $('#ohSort').value;
  if(s==='end') r.sort((a,b)=>a.nearEnd.localeCompare(b.nearEnd));
  else if(s==='value') r.sort((a,b)=>(b.valueEok??-1)-(a.valueEok??-1));
  else r.sort((a,b)=>(b.pctFloat??-1)-(a.pctFloat??-1));
  return r;
}
function ohEvLine(c, e){
  const t = todayStr();
  const live = c.close;
  const money = (live && e.conv_price) ? (live/e.conv_price-1)*100 : null;
  const open = e.start && e.start <= t;
  const dd = ddayOf(e.end);
  const tc = e.subtype==='cps' ? 't-cps' : (TYPE_CLASS[e.event_type]||'');
  return `<div class="ohev">
    <span class="badge ty ${tc}">${e.subtype==='cps'?'CPS':(TYPE_SHORT[e.event_type]||'')}</span>
    <a href="${e.dart_url}" target="_blank" rel="noopener">${fmtD(e.event_date,t)} 공시 ↗</a>
    <span class="num"><b>${nf(e.shares)}</b>주${e.pct_float!=null?` · 유동 ${e.pct_float.toFixed(1)}%`:''}</span>
    ${e.conv_price?`<span class="num">전환가 ${nf(e.conv_price)}원${money!=null?` · <b class="${money>0?'good':'bad'}">${pct(money)}</b>`:''}</span>`:''}
    <span class="num">${e.start?fmtD(e.start,t):'?'} ~ ${fmtD(e.end,t)}
      <span class="st ${open?'on':'wait'}">${open?'청구가능':'대기'}</span>
      <span class="dday2">${dd===0?'D-Day':'D-'+dd}</span></span>
    ${e.refix?'<span class="badge o">리픽싱</span>':''}
    ${e.is_private?'<span class="badge o">사모</span>':''}
    ${e.adv_days!=null?`<span class="badge o">ADV ${nf(e.adv_days,1)}일</span>`:''}
  </div>`;
}
function renderOh(){
  const data = ohRows(), box = $('#ohlist');
  const t = todayStr();
  box.innerHTML = '';
  data.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'ohcard' + (state.ohOpen.has(c.stock_code)?' open':'');
    const w = c.pctFloat!=null ? Math.min(100, c.pctFloat) : 0;
    el.innerHTML = `
      <div class="ohhead">
        <div>
          <div class="rname">${c.corp_name} <span class="code num">${c.stock_code||''}</span>
            ${c.market?`<span class="badge o">${c.market}</span>`:''}
            <span class="badge o">${c.evs.length}건</span></div>
          <div class="ohk num">${c.float_shares?`유동주식 ${nf(c.float_shares)}주 (${c.float_ratio_pct!=null?c.float_ratio_pct+'%':''})`:'유동주식수 미확보'}
            ${c.mcapEok!=null?` · 시총 ${nf(c.mcapEok)}억`:''}${c.close?` · 현재가 ${nf(c.close)}원`:''}</div>
        </div>
        <div><span class="ohk">잠재물량 / 유동주식수</span>
          <div class="ohv num">${nf(c.shares)}주${c.pctFloat!=null?` · <b class="${c.pctFloat>=30?'bad':''}">${c.pctFloat.toFixed(1)}%</b>`:''}</div>
          ${c.pctFloat!=null?`<div class="ohbar"><i class="${c.pctFloat>=30?'hi':''}" style="width:${w}%"></i></div>`:''}</div>
        <div><span class="ohk">금액(현재가) / 유동시총</span>
          <div class="ohv num">${c.valueEok!=null?nf(c.valueEok)+'억':'—'}${c.floatEok!=null?` / ${nf(c.floatEok)}억`:''}</div></div>
        <div><span class="ohk">오버행 종료</span>
          <div class="ohv num">${fmtD(c.nearEnd,t)}${c.evs.length>1?' 외':''}</div></div>
      </div>
      <div class="ohevents">${c.evs.map(e=>ohEvLine(c,e)).join('')}</div>`;
    el.querySelector('.ohhead').onclick = ()=>{
      state.ohOpen.has(c.stock_code) ? state.ohOpen.delete(c.stock_code) : state.ohOpen.add(c.stock_code);
      el.classList.toggle('open');
    };
    box.appendChild(el);
  });
  $('#count').textContent = `${data.length}개 종목 · 전환청구 창 진행/대기 중`;
}

function render(){
  if(state.tab==='cal') renderList(); else renderOh();
}
function setTab(tab){
  state.tab = tab;
  $('#tabCal').classList.toggle('on', tab==='cal');
  $('#tabOh').classList.toggle('on', tab==='oh');
  $('#calWrap').style.display = tab==='cal' ? '' : 'none';
  $('#ohlist').style.display = tab==='oh' ? '' : 'none';
  $('#fSort').style.display = tab==='cal' ? '' : 'none';
  $('#ohSort').style.display = tab==='oh' ? '' : 'none';
  $('#ohMcap').style.display = tab==='oh' ? '' : 'none';
  $('#ohFcap').style.display = tab==='oh' ? '' : 'none';
  render();
}
$('#tabCal').onclick = ()=>setTab('cal');
$('#tabOh').onclick = ()=>setTab('oh');

function renderMeta(){
  const m = state.data.meta;
  $('#meta').innerHTML = [
    `기준 <b>${m.generated_at}</b>`,
    `진행 중 <b>${m.count}</b>건`,
    m.overhang_count!=null?`오버행 <b>${m.overhang_count}</b>종목`:'',
    `<span class="pulse"></span>자동 갱신 <b id="lastChk">대기</b>`,
  ].filter(Boolean).map(x=>`<span class="chip">${x}</span>`).join('')
  + `<button class="tgl" style="display:none"></button>`;
  $('#footer').innerHTML = `${m.disclaimer||''} · 캘린더는 최근 ${m.window_days}일, `
    + `오버행은 최근 ${m.overhang_window_days||1200}일 발행분 중 전환청구 창이 남은 건 기준 · `
    + `새 공시는 폴러가 감지 후 수 분 내 자동 반영`;
}

async function boot(){
  try{
    state.data = await (await fetch('calendar_data.json?'+Date.now(),{cache:'no-store'})).json();
    $('#boot').style.display='none';
    renderMeta(); render();
  }catch(e){
    $('#boot').textContent = '데이터를 불러오지 못했습니다: ' + e;
  }
}

// 준실시간: 3분마다 정적 데이터 재확인, 갱신 시각이 바뀌면 자동 반영
// (폴러가 새 공시 감지 -> export+push -> Pages 재배포 흐름을 페이지가 따라감)
async function autoCheck(){
  try{
    const d = await (await fetch('calendar_data.json?'+Date.now(),{cache:'no-store'})).json();
    if(state.data && d.meta.generated_at !== state.data.meta.generated_at){
      const selKey = state.sel && (state.sel.stock_code + state.sel.event_date);
      state.data = d;
      state.sel = d.companies.find(c=>c.stock_code+c.event_date===selKey) || null;
      renderMeta(); render(); if(state.tab==='cal') renderDetail();
    }
    const el = $('#lastChk');
    if(el) el.textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ /* 다음 주기에 재시도 */ }
}
setInterval(autoCheck, 180000);
// ↻ 시세: 프록시가 설정돼 있으면 실시간 시세, 아니면 최신 정적 데이터 재로드
async function refreshQuotes(){
  const btn=$('#refreshBtn'); btn.disabled=true; btn.textContent='갱신 중…';
  try{
    if(QUOTE_PROXY){
      const pool = state.tab==='oh' ? (state.data.overhang||[]) : state.data.companies;
      const codes=[...new Set(pool.map(c=>c.stock_code).filter(Boolean))];
      for(let i=0;i<codes.length;i+=40){
        const r=await fetch(`${QUOTE_PROXY}?codes=${codes.slice(i,i+40).join(',')}`);
        const j=await r.json();
        Object.assign(state.quotes, j.quotes||{});
      }
      state.qstamp='실시간 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    } else {
      const selKey=state.sel && (state.sel.stock_code+state.sel.event_date);
      state.data=await (await fetch('calendar_data.json?'+Date.now(),{cache:'no-store'})).json();
      state.sel=state.data.companies.find(c=>c.stock_code+c.event_date===selKey)||null;
      state.qstamp='정적 데이터 '+(state.data.meta.generated_at||'').slice(5,16)+' 기준';
      renderMeta();
    }
  }catch(e){ state.qstamp='갱신 실패'; }
  btn.disabled=false; btn.textContent='↻ 시세';
  const st=$('#qstamp'); st.style.display=''; st.textContent=state.qstamp;
  render(); if(state.tab==='cal') renderDetail();
}
$('#refreshBtn').onclick=refreshQuotes;

['input','change'].forEach(ev=>['#q','#fType','#fSort','#ohSort','#ohMcap','#ohFcap'].forEach(s=>$(s).addEventListener(ev,()=>{render();})));
$('#themeBtn').onclick = ()=>{
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme') || 'dark';
  r.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
};
// 고정 상단 영역 높이 -> 상세 패널 오프셋 (--tbh)
function setTbh(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--tbh', tb.offsetHeight + 'px');
}
addEventListener('resize', setTbh);
new MutationObserver(setTbh).observe($('#meta'), {childList:true});
setTbh();
if(matchMedia('(prefers-color-scheme: light)').matches)
  document.documentElement.setAttribute('data-theme','light');
boot();
</script>
</body>
